version: 1
score:
  test_weight: 0.30
  metric_weight: 0.70
  formula: S_t = 0.3 * S_test + 0.7 * S_metric
  reward: R_t = S_t - S_t_minus_1

test_groups:
  - id: build
    title: 构建与启动
    weight: 0.10
    mandatory: true
    verifier: command_exit
    timeout_seconds: 600
    command: [mvn, -B, -o, -DskipTests, package]

  - id: matching_behavior
    title: 撮合行为
    weight: 0.30
    mandatory: true
    verifier: junit
    expected_reports:
      - exchange.core2.core.orderbook.OrderBookDirectImplTest
      - exchange.core2.core.orderbook.OrderBookDirectImplExchangeTest
      - exchange.core2.core.orderbook.OrderBookDirectImplMarginTest
      - exchange.core2.tests.integration.ITMultiOperation
    timeout_seconds: 600
    command:
      - mvn
      - -B
      - -o
      - test
      - -Dtest=OrderBookDirectImplTest,OrderBookDirectImplExchangeTest,OrderBookDirectImplMarginTest,ITMultiOperation

  - id: risk_and_balance
    title: 风险与账户
    weight: 0.20
    mandatory: true
    verifier: junit
    expected_reports:
      - exchange.core2.tests.integration.ITFeesExchangeBasic
      - exchange.core2.tests.integration.ITFeesMarginBasic
    timeout_seconds: 600
    command:
      - mvn
      - -B
      - -o
      - test
      - -Dtest=ITFeesExchangeBasic,ITFeesMarginBasic

  - id: state_consistency
    title: 状态一致性
    weight: 0.20
    mandatory: true
    verifier: junit
    expected_reports:
      - exchange.core2.tests.integration.ITExchangeCoreIntegrationBasic
    timeout_seconds: 600
    command:
      - mvn
      - -B
      - -o
      - test
      - -Dtest=ITExchangeCoreIntegrationBasic

  - id: compatibility
    title: 接口兼容
    weight: 0.10
    mandatory: true
    verifier: junit
    expected_reports:
      - exchange.core2.core.SimpleEventsProcessorTest
    timeout_seconds: 600
    command:
      - mvn
      - -B
      - -o
      - test
      - -Dtest=SimpleEventsProcessorTest

  - id: boundary_and_failure
    title: 边界与异常
    weight: 0.10
    mandatory: true
    verifier: junit
    expected_reports:
      - exchange.core2.tests.integration.ITExchangeCoreIntegrationRejectionBasic
    timeout_seconds: 600
    command:
      - mvn
      - -B
      - -o
      - test
      - -Dtest=ITExchangeCoreIntegrationRejectionBasic

hard_gates:
  - build_failure
  - mandatory_test_failure
  - integrity_violation
  - metric_protocol_failure
  - test_protocol_failure
  - calibration_missing
